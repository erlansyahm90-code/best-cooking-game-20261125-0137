<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Junction Kitchen — a train-station cooking game</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<main>
  <canvas id="game" width="1280" height="720" aria-label="Junction Kitchen: cook dishes for departing trains. Move with WASD or arrow keys, press E or click to work a station."></canvas>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="debug-state"></p>
  <p class="hint">Junction Kitchen — orders arrive as trains. Chop, cook, plate, serve before departure. WASD/arrows to move, E or click to work a station, T for recipes.</p>
</main>
<script type="module" src="./js/main.js"></script>
</body>
</html>
